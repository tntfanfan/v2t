<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f0">
  <meta name="description" content="魔法木琴：九页互动漫画。点击气泡听一句，点击画格听整格，声音来自视频原片。">
  <title>魔法木琴 · Bluey 原声漫画</title>
  <link rel="stylesheet" href="styles.css">
  <script src="book-data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#reader">跳到漫画</a>
  <header class="site-header">
    <a class="brand" href="#panel-1" aria-label="从第一格开始看">
      <span class="brand-mark" aria-hidden="true">b.</span>
      <span><strong>Bluey</strong><small>一起看，一起听</small></span>
    </a>
    <div class="book-heading"><span class="eyebrow">第一季 · 第 1 集</span><h1>魔法木琴 <span>Magic Xylophone</span></h1></div>
    <span class="source-badge"><i></i> 视频原声</span>
  </header>

  <div class="reading-shell">
    <aside class="chapters" aria-label="漫画目录">
      <div class="rail-title">故事目录 <span>09</span></div>
      <nav id="page-nav"></nav>
      <p class="rail-note">把好玩的游戏<br>也分一半给你。</p>
    </aside>

    <main id="reader" class="reader" tabindex="-1">
      <div class="reader-toolbar">
        <div class="page-heading"><span id="chapter-index">01 / 09</span><h2 id="chapter-title">钢琴游戏</h2></div>
        <div class="view-switch" role="group" aria-label="阅读方式">
          <button id="view-page" aria-pressed="true">整页看</button>
          <button id="view-panel" aria-pressed="false">一格看</button>
        </div>
      </div>
      <div class="reading-tip"><span aria-hidden="true">♪</span> 点气泡听一句，点画面听整格 <button id="outline-toggle" aria-pressed="false">显示可点区域</button></div>
      <div id="art-stage" class="art-stage" aria-label="互动漫画">
        <img id="page-image" alt="" draggable="false" width="1024" height="1536">
        <div id="panel-hotspots" class="hotspots"></div>
        <div id="bubble-hotspots" class="hotspots"></div>
        <div id="image-status" class="image-status">正在打开漫画…</div>
      </div>
      <div class="page-turner"><button id="prev-page">← 上一页</button><label class="page-select-label">第 <select id="page-select" aria-label="跳到指定页"></select> 页 / 9</label><button id="next-page">下一页 →</button></div>
    </main>

    <aside class="listen-card" aria-label="当前画格的点读台词">
      <div class="listen-heading"><span class="eyebrow">LISTEN & SAY</span><span id="panel-chip" class="panel-chip">第 1 格</span></div>
      <h2>听听他们说什么</h2>
      <p id="speaker-name" class="speaker-name">片头合声</p>
      <blockquote id="current-line" lang="en">Mum!</blockquote>
      <p id="line-note" class="line-note" hidden></p>
      <button id="replay-line" class="replay-line"><span aria-hidden="true">↻</span> 再听这句话</button>
      <div class="divider"></div>
      <div class="line-list-heading"><h3>这一格的台词</h3><span id="line-count"></span></div>
      <div id="line-list" class="line-list"></div>
      <p class="sound-note">熟悉的声音，来自原片。<br>也保留了音乐和小小的笑声。</p>
    </aside>
  </div>

  <footer class="player-bar" aria-label="原声播放器">
    <div class="player-inner">
      <div class="player-info"><span id="player-kind">准备点读</span><p id="player-status" role="status" aria-live="polite">点击漫画，让故事开口说话</p></div>
      <div class="transport">
        <button id="prev-panel" class="step-button" aria-label="上一格">‹</button>
        <button id="play-toggle" class="play-toggle" aria-label="播放这一格"><span id="play-icon" aria-hidden="true">▶</span><span id="play-label">听这一格</span></button>
        <button id="next-panel" class="step-button" aria-label="下一格">›</button>
      </div>
      <div class="play-progress"><label class="sr-only" for="seek">播放进度</label><input id="seek" type="range" min="0" max="1000" value="0" disabled><div><span id="elapsed">0:00</span><span id="panel-progress">1 / 54 格</span><span id="duration">0:00</span></div></div>
      <div class="speed-control"><label for="speed">速度</label><select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1.0×</option><option value="1.25">1.25×</option></select></div>
    </div>
  </footer>
  <audio id="voice" preload="none"></audio>
  <noscript>请启用浏览器 JavaScript 以使用漫画点读。</noscript>
</body>
</html>
